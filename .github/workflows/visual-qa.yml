name: Visual QA screenshots

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: Capture production UI
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Package DiskPrune.app
        run: bash scripts/package-macos.sh
        env:
          DISKPRUNE_VERSION: "1.0.0"
          DISKPRUNE_BUILD: ${{ github.sha }}

      - name: Capture production UI screenshots
        run: bash scripts/visual-qa.sh
        env:
          DISKPRUNE_VISUAL_QA_OUT: ${{ github.workspace }}/visual-qa-shots
          DISKPRUNE_APP: ${{ github.workspace }}/app/DiskPrune.app

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-${{ github.sha }}
          path: visual-qa-shots
          if-no-files-found: error

      - name: Summarize
        if: always()
        run: |
          echo "Gate 4 remains NOT PASS. These screenshots are supplemental evidence."
          if [[ -f visual-qa-shots/README.txt ]]; then
            cat visual-qa-shots/README.txt
          fi
