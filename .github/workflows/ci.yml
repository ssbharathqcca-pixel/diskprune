name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  swift-build:
    name: 1 Swift build (debug)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift build (debug)
        run: cd app && swift build

  swift-test:
    name: 2 Swift unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift unit tests
        run: cd app && swift test

  guardrails:
    name: 3 Destructive-operation guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run guardrails
        run: bash scripts/ci-guardrails.sh
