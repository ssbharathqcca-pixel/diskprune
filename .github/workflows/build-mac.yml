name: Build macOS App

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Ad-hoc Visual QA DMGs must never become GitHub Releases.
# /releases/latest currently must not be overwritten by package-macos.sh.
# Notarized publishing lives on the Gate 5 pipeline (draft+prerelease only).
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Package app and DMG (ad-hoc QA only)
      run: bash scripts/package-macos.sh
      env:
        DISKPRUNE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.0.0-dev' }}
        DISKPRUNE_BUILD: ${{ github.sha }}

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DiskPrune-${{ github.sha }}
        path: app/DiskPrune.dmg
        if-no-files-found: error
