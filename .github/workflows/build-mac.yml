name: Build macOS App

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Package app and DMG
      run: bash scripts/package-macos.sh
      env:
        DISKPRUNE_VERSION: "1.0.0"
        DISKPRUNE_BUILD: ${{ github.sha }}

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DiskPrune-${{ github.sha }}
        path: app/DiskPrune.dmg
        if-no-files-found: error

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: app/DiskPrune.dmg
        name: "DiskPrune ${{ github.ref_name }}"
        generate_release_notes: true
        draft: false
        prerelease: false
