name = "diskprune-licensing"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "api.diskprune.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "diskprune-licenses"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[triggers]
crons = ["0 */6 * * *"]

# Secrets (wrangler secret put — never commit):
#   STRIPE_WEBHOOK_SECRET
#   LICENSE_ENCRYPTION_KEY          # 32 raw bytes, base64
#   LICENSE_SIGNING_KEY_K1          # PKCS#8 Ed25519, base64
#   LICENSE_SIGNING_PUB_K1          # raw 32-byte public key, base64
#   RESEND_API_KEY
# Optional:
#   LICENSE_ENCRYPTION_KEY_V2
#   LICENSE_SIGNING_KEY_K2 / LICENSE_SIGNING_PUB_K2
#   STRIPE_PRICE_ID                 # fallback products.stripe_price_id

[vars]
LICENSE_FROM_EMAIL = "DiskPrune <licenses@diskprune.com>"
SUPPORT_URL = "https://diskprune.com/support"
REFUND_URL = "https://diskprune.com/refunds"
DOWNLOAD_URL = "https://github.com/ssbharathqcca-pixel/diskprune/releases/latest"
CORS_ORIGIN = "https://diskprune.com"
